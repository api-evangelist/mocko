    PostOrdersResponse:
      type: object
      properties:
        status:
          type: string
        items:
          type: array
          description: Array of created items with sku and position
    GetOrdersIdResponse:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
    PostOrdersOrderidRequest:
      type: object
      properties:
