components:
  schemas:
    GetExportsIdResponse:
      type: object
      properties:
        id:
          type: string
          description: The export identifier.
        status:
          type: string
          description: Current status of the export (e.g., "queued", "processing", "done").
        url:
          type: string
          description: Download URL, present when status is "done".
    DeleteExportsIdPollsResponse:
      type: object
      properties:
        reset:
          type: boolean
          description: Indicates the poll counter was reset.
    GetInvoicesIdResponse:
      type: object
      properties:
        id:
          type: string
          description: The invoice identifier, echoed from the request
        status:
          type: string
          description: Fixed value "past_due"
    GetProductsResponse:
      type: object
      properties:
        '[]':
          type: array
          description: Array of product objects
    GetProductsIdResponse:
      type: object
      properties:
        id:
          type: integer
          description: Product identifier
        name:
          type: string
          description: Product name
        price:
          type: number
          description: Product price
        error:
          type: string
          description: Error message when product not found
    GetPurchasesResponse:
      type: object
      properties:
        product:
          type: string
        qty:
          type: integer
    PostPurchasesRequest:
      type: object
      properties:
        product:
          type: string
        qty:
          type: integer
    GetUsersResponse:
      type: object
      properties:
        '[]':
          type: array
          description: List of user objects.
    PostUsersRequest:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
    PostUsersResponse:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
    DeleteUsersIdResponse:
      type: object
      properties:
        deleted:
          type: boolean
          description: Indicates successful deletion.
    GetUsersIdResponse:
      type: object
      properties:
        user:
          type: object
          description: User object if found.
        error:
          type: string
          description: Error message when user not found (404).
    PutUsersIdRequest:
      type: object
      properties:
        body:
          type: object
          description: Updated user data.
      required:
      - body
    PutUsersIdResponse:
      type: object
      properties:
        user:
          type: object
          description: Updated user object.
        error:
          type: string
          description: Error message when user not found (404).
  securitySchemes:
    Bearer:
      type: http
      scheme: bearer
      x-source: https://mocko.dev/docs/sdk/auth
tags:
- name: Exports
- name: Invoices
- name: Posts
- name: Products
- name: Purchases
- name: Reports
- name: Users
security:
- Bearer: []
